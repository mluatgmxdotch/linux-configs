# bumblebee-status config file
#
# Module reference: bumblebee-status -l modules
# Docs: https://bumblebee-status.readthedocs.io
#
# Load the same module multiple times with <module>:<alias>,
# parameters are then set via <alias>.<key>=<value>.
#
# Host specific overrides are loaded afterwards from
# ~/.config/bumblebee-status/config, link it to the host file:
#   ln -s ~/.config/bumblebee-status/hosts/$(hostname).conf ~/.config/bumblebee-status/config

[core]
modules = pasink, nic, traffic, memory, cpu, sensors, command:mouse, command:keyboard, indicator, datetime
theme = iceberg-black
interval = 1

[module-parameters]
# Volume indicator
pasink.percent_change = 5%

# Network interface monitoring
nic.interval = 10
nic.format = {intf} {ip} {ssid} {strength}
nic.states = ^down
traffic.showname = false
traffic.states = ^down
traffic.interval = 5

# Memory usage
memory.format = {used} ({percent:.0f}%)
memory.interval = 30

# CPU usage
cpu.interval = 10

# Temperature
sensors.use_sensors = true
sensors.json = true
sensors.path = coretemp-isa-0000/Package id 0/temp1_input
sensors.show_freq = false
sensors.interval = 10

# Peripheral batteries (logitech hid++)
# command: upstream copy of the shell module (~/.config/bumblebee-status/modules),
# the 2.2.0 one hangs in sync mode and shows async output one interval late
mouse.command = ~/.local/share/bumblebee-status/power.sh vertical 🖱
mouse.async = true
mouse.interval = 10
keyboard.command = ~/.local/share/bumblebee-status/power.sh keyboard ⌨
keyboard.async = true
keyboard.interval = 10

# Key indicators
indicator.include = capslock,numlock
indicator.interval = 1

# Date Time
datetime.format = %Y-%m-%d %H:%M:%S
datetime.interval = 5
