# vanaheim overrides for ~/.config/bumblebee-status.conf

[core]
modules = pasink, nic, traffic, zfspool, disk:docker, memory, cpu, sensors, command:mouse, command:keyboard, indicator, datetime, bluetooth2

[module-parameters]
# Disk usage
# zfspool: patched copy of the zpool module (~/.config/bumblebee-status/modules),
# the 2.2.0 one skips pools without /proc/spl/kstat/zfs/<pool>/io (OpenZFS 2.x)
zfspool.list = rpool
zfspool.format = {name} {left}
zfspool.showio = false
zfspool.interval = 30

docker.path = /mnt/docker
docker.format =  {left}
docker.interval = 30
