---
- name: DotNet
  hosts: all
  become: yes
  gather_facts: True

  roles:
    - base
    - role: nvim
      vars:
        use_csharp: true
    - ohmyzsh
    - lazygit
    - x11forward
    - docker
    - code
    - nodedev
    - role: dotnetdev
      vars:
        dotnet9: true
    - azure
    - kubernetes

