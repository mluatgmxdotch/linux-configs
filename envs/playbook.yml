---

# java
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "jakarta"
        forwarded_port: []

# node / ts
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "newfoundland"
        forwarded_port: []

# go
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "gozo"
        forwarded_port: []
  tags:
    - go

# python
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "papua"
        forwarded_port: [8000]
  tags:
    - python

# dotnet
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "donna"
        external_container_storage: "/mnt/docker/donna"
  tags:
    - dotnet

# dotnet
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "dina"
        image_alias: noble
        # aspire dashboard
        forwarded_port: [ "8080", "8081", "8082","17024","11666","3000","3200"]
  tags:
    - dotnet-new

# testing
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
         instance_name: "kayak"
         forwarded_port: []
  tags:
    - testing

# minimal
- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "avalon"
        image_alias: "resolute"
        forwarded_port: []
  tags:
    - minimal
    - agent

- hosts: localhost
  connection: local
  roles:
    - role: lxd_container
      vars:
        instance_name: "elba"
        instance_type: virtual-machine
        forwarded_port: []
        profiles: ["dev","vm"]
  tags:
    - edge

       
